services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankio
      POSTGRES_USER: bankio
      POSTGRES_PASSWORD: bankio_dev_password
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankio -d bankio"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://bankio:bankio_dev_password@db:5432/bankio
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: dev-only-secret-key-change-me
      DEBUG: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
