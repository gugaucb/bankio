{% extends "manager/base.html" %}
{% block page %}
<h1 class="text-2xl font-bold text-slate-900 mb-6">New User</h1>
<div class="max-w-xl bg-white rounded-2xl shadow-sm p-6">
  {% if error %}<div class="mb-4 text-sm bg-red-50 text-red-800 rounded-xl p-3">{{ error }}</div>{% endif %}
  <form method="post" class="flex flex-col gap-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
      <input name="username" value="{{ form.username }}" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
      <input type="email" name="email" value="{{ form.email }}" required class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">First name</label>
        <input name="first_name" value="{{ form.first_name }}" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Last name</label>
        <input name="last_name" value="{{ form.last_name }}" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Phone</label>
      <input name="phone" value="{{ form.phone }}" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Role</label>
      <select name="role" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white text-sm">
        {% for value, label in roles %}<option value="{{ value }}" {% if form.role == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
      <input type="password" name="password" required minlength="8" class="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm">
    </div>
    <div class="flex gap-3">
      <button class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700">Create User</button>
      <a href="{% url 'admin_users' %}" class="px-5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
