<form hx-post="/manage/open-account/" hx-target="#op-result" class="space-y-2">
  {% csrf_token %}
  <input type="hidden" name="customer_id" value="{{ c.pk }}">
  <select name="product_type" required class="w-full rounded-xl border-gray-200 text-xs">
    <option value="CHECKING">Checking</option><option value="SAVINGS">Savings</option>
    <option value="SALARY">Salary</option><option value="JOINT">Joint (approval req.)</option>
    <option value="BUSINESS">Business (KYB)</option>
  </select>
  <button class="btn-primary w-full !py-1.5 text-xs">Open account</button>
  <p class="text-[10px] text-gray-400">Requires verified KYC. Account number is generated by the system.</p>
</form>
