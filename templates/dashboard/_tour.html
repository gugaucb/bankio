{% if show_tour %}
<link rel="stylesheet" href="/static/js/vendor/driver.css">
<script src="/static/js/vendor/driver.iife.js" defer></script>
<script>
  // First-access tutorial. Presentation only: it never mutates financial
  // data, never bypasses CSRF/RBAC, and degrades to a no-op if the library
  // fails to load (application stays fully functional).
  window.addEventListener("load", function () {
    if (!window.driver || !window.driver.js || !window.driver.js.driver) return;   // graceful degradation
    var drive = window.driver.js.driver;
    var steps = JSON.parse(document.getElementById("tour-steps").textContent);
    var reachedLastStep = false;
    // The final step is identifiable by its "Concluir" button; remember it,
    // because driver resets its state while destroying.
    var mo = new MutationObserver(function () {
      var btn = document.querySelector(".driver-popover-next-btn");
      if (btn && btn.textContent.indexOf("Concluir") !== -1) reachedLastStep = true;
    });
    mo.observe(document.body, {childList: true, subtree: true});
    function csrfToken() {
      var el = document.querySelector("[name=csrfmiddlewaretoken]");
      if (el) return el.value;
      var m = document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : "";
    }
    var token = csrfToken();

    function report(outcome) {
      try {
        fetch("/app/tour/" + outcome + "/", {
          method: "POST",
          headers: {"X-CSRFToken": token, "X-Requested-With": "fetch"},
        });
      } catch (e) { /* notification of outcome is best-effort */ }
    }

    var driverObj = drive({
      showProgress: true,
      allowClose: true,
      nextBtnText: "Próximo →",
      prevBtnText: "← Voltar",
      doneBtnText: "Concluir ✓",
      steps: steps,
      onDestroyed: function () {
        mo.disconnect();
        // Reaching the final step and leaving it counts as completion
        // ("Concluir ✓"); any other exit (Escape / overlay) is a skip.
        report(reachedLastStep ? "complete" : "skip");
      },
    });

    driverObj.drive();
  });
</script>
{# Server-generated JSON (apps/identity/tour.py); only literal tour copy, no user input #}
<script type="application/json" id="tour-steps">{{ tour_steps|safe }}</script>
{% endif %}
