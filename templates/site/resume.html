{% extends "site/base.html" %}
{% block title %}Resume application — Bankio{% endblock %}
{% block content %}
<section class="max-w-md mx-auto px-4 py-16">
  <h1 class="text-2xl font-bold text-emerald-950">Resume your application</h1>
  <p class="text-sm text-gray-500 mt-2">Enter your application reference and the email you used.</p>
  {% if error %}<div class="card p-3 mt-4 bg-red-50 text-red-700 text-sm">{{ error }}</div>{% endif %}
  <form method="post" action="/application/resume/" class="card p-6 mt-6 space-y-4">
    {% csrf_token %}
    <label class="block text-sm font-semibold">Application reference
      <input name="reference" placeholder="BNK-APP-123456" required class="mt-1 w-full rounded-xl border-gray-200"></label>
    <label class="block text-sm font-semibold">Email
      <input type="email" name="email" required class="mt-1 w-full rounded-xl border-gray-200"></label>
    <button class="btn-primary w-full">Find my application</button>
  </form>
</section>
{% endblock %}
